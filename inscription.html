<!doctype html><html lang="fr"><head><title>Créer un compte</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"></head><body>
<main class="login"><h1>Créer un compte</h1>
<form id="f" class="card" novalidate>
<label for="nom">Nom</label><input id="nom" type="text" autocomplete="name" required>
<label for="email">Adresse e-mail</label><input id="email" type="email" autocomplete="username" required>
<label for="pw">Mot de passe (8 caractères minimum)</label><input id="pw" type="password" autocomplete="new-password" required>
<p id="err" class="error" role="alert"></p>
<button class="btn primary" style="width:100%" id="go">Créer mon compte</button>
<p style="text-align:center"><a href="index.html">J'ai déjà un compte</a></p></form></main>
<div id="loader" class="loader hidden" role="status" aria-label="Chargement"></div>
<script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/api.js"></script>
<script>
if (Auth.token()) location.replace('home.html');
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const b = document.getElementById('go'), err = document.getElementById('err'), l = document.getElementById('loader');
  err.textContent = ''; b.disabled = true; l.classList.remove('hidden');
  try { const d = await Api.register(nom.value, email.value, pw.value); Auth.set({ token: d.token, user: d.user }); location.replace('home.html'); }
  catch (x) { err.textContent = x.message; l.classList.add('hidden'); b.disabled = false; }
});
</script></body></html>
