<!doctype html><html lang="fr"><head><title>Ajouter un quiz</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"></head><body>
<header class="top"><strong>Révisions</strong><nav aria-label="Navigation principale"><a class="btn" href="home.html">Accueil</a><a class="btn" href="settings.html">Paramètres</a></nav></header>
<main><h1 id="title">Ajouter un quiz</h1>
<form id="f" novalidate>
<section class="card"><h2 style="margin-top:0">Quiz</h2>
<label for="nom">Nom</label><input id="nom" type="text" maxlength="100" required><p class="sheetnote">Colonne « nom » de la feuille Quiz</p>
<label for="desc">Description</label><textarea id="desc" rows="2" maxlength="300"></textarea><p class="sheetnote">Colonne « description »</p></section>
<div id="qlist"></div>
<p><button type="button" class="btn" id="addQ">+ Ajouter une question</button></p>
<p id="err" class="error" role="alert"></p>
<p><button class="btn primary" id="save">Enregistrer dans Google Sheets</button></p>
</form></main>
<div id="loader" class="loader hidden" role="status" aria-label="Chargement"></div><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/api.js"></script><script src="js/add.js"></script><script src="js/fab.js"></script></body></html>
